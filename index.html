있어서 한 번 배우면 Oracle, MySQL 등 다른 DBMS에도 대부분 그대로 적용된다.\n실제로 hr_postgres.sql은 Oracle HR 샘플을 PostgreSQL로 옮긴 것.\n4. 데이터 적재\n데이터\t스키마\t내용\n생산 데이터\tbom (bom_lab DB)\t품목 마스터, BOM 구조, 구매처, 재고, 생산계획 등 17개 테이블\nHR 데이터\thr\t지역 → 국가 → 위치 → 부서 → 직원, 직무, 직무이력 7개 테이블\n생산 데이터는 part_master(품목)를 중심으로 나머지가 붙은 별 모양, HR 데이터는 지역부터 직원까지 이어지는 계층 모양의 ERD.\n5. SQL과 SELECT 기본\nSQL: DB에 명령을 내리는 언어 / 쿼리(Query): 데이터 검색·조회 질의\n종류: 조회(SELECT) / 변경(INSERT·UPDATE·DELETE) / 정의(CREATE·ALTER·DROP)\nSQL 키워드는 대소문자 구분 안 함, 단 'King' 같은 데이터 값은 구분\n문장 끝에 세미콜론 ;\n작은따옴표 '값' = 문자열·날짜 값 / 큰따옴표 \"이름\" = 컬럼명·별칭\n작성 순서 vs 실행 순서\n작성 순서\t절\t하는 일\t실행 순서\n1\tSELECT\t출력할 컬럼\t5\n2\tFROM\t데이터를 가져올 테이블\t1\n3\tWHERE\t원하는 행만 고르는 조건\t2\n4\tGROUP BY\t특정 컬럼 기준으로 그룹화\t3\n5\tHAVING\t그룹에 조건 지정\t4\n6\tORDER BY\t정렬\t6\n핵심: SELECT는 쓰기는 맨 먼저지만 실행은 거의 마지막. 그래서 SELECT에서 만든 별칭은 WHERE에서 못 쓰고, ORDER BY에서는 쓸 수 있다.\n\n실습 코드 (SELECT절: *, DISTINCT, 별칭, 사칙연산)\nSET search_path TO hr;   -- 매번 hr.employees 라고 안 써도 되게 스키마 지정\n\n-- 3-1 전체 컬럼 (* = 모든 컬럼)\nSELECT * FROM employees;\n\n-- 3-2 원하는 컬럼만\nSELECT employee_id, first_name FROM employees;\n\n-- 3-3 중복 제거: DISTINCT\nSELECT DISTINCT department_id FROM employees;          -- 107행 → 12행\nSELECT DISTINCT job_id, department_id FROM employees   -- 두 컬럼 \"조합\"이 중복인 것만 제거\nORDER BY 2;                                            -- 2 = SELECT의 두 번째 컬럼 기준 정렬\n\n-- 3-4 산술 연산과 별칭\nSELECT salary\n     , salary + 1 AS 더하기1\n     , salary - 1 AS 빼기1\n     , salary * 2 AS 곱하기2\n     , salary / 2 AS 나누기2\nFROM employees;\n\nSELECT hire_date, hire_date + 30 AS \"한달 뒤\"   -- 날짜 + 숫자 = 날짜 (일 단위)\nFROM employees;\n\n-- 별칭 4가지 방법\nSELECT hire_date 입사일          -- AS 생략\n     , hire_date \"입사 일\"       -- 띄어쓰기가 있으면 큰따옴표 필수\n     , hire_date AS 입사일\n     , hire_date AS \"입사 일\"\nFROM employees;\n\n-- 별칭은 WHERE에서 사용 불가, ORDER BY에서는 가능\nSELECT hire_date AS \"입사일\"\nFROM employees\nWHERE hire_date > '2003-01-01'   -- 여기서 입사일 X (WHERE가 SELECT보다 먼저 실행)\nORDER BY 입사일;                  -- 여기서는 O\n실습하며 발견한 점\nDISTINCT department_id 결과가 12행인데 실제 직원이 있는 부서는 11개다. → 부서가 없는 직원이 1명 있어서 NULL도 하나의 값으로 묶여 1행이 나온 것. → 오전에 배운 \"FK는 NULL 가능\"이 실제 데이터로 확인된 사례.\ndepartments에는 27개 부서가 있지만 직원이 속한 부서는 11개뿐 → 직원이 없는 부서가 16개. → 오전에 배운 참여도 \"O(선택)\" — 부서는 직원이 0명이어도 존재할 수 있다.\n6. 막혔던 점과 해결 (Mac 환경)\n문제\t원인\t해결\n터미널에서 psql 실행 안 됨\tPostgreSQL은 설치됐지만 /Library/PostgreSQL/18/bin이 PATH에 없었음\t~/.zprofile에 PATH 추가\n\\cd 'C:/bom_lab' 에러\t강의 자료가 Windows 기준 경로\tMac 경로 /Users/chun3/bom_lab으로 변경\n한글 별칭 쿼리 에러\t\\encoding UHC(Windows 명령창용 설정)로 인코딩이 바뀌어 있었음\tMac은 \\encoding UTF8 유지, UHC 줄은 빼고 실행\npgAdmin 4가 실행 안 됨\t내 Mac은 Intel CPU인데 설치된 pgAdmin은 Apple Silicon(arm64) 전용\tIntel용 pgadmin4-x64.dmg 별도 설치\n들여쓰기가 딱 안 맞음\tSELECT가 6글자라 콤마를 T 아래 두려면 5칸 필요, 탭은 4칸\t탭 대신 공백 사용 (편집기마다 탭 너비가 달라서)\npsql의 \\c, \\dt, \\i 같은 역슬래시 명령은 SQL이 아니라 psql 자체 명령 → 세미콜론 불필요, 서버로 안 보내짐.\npgAdmin에서 새로 적재한 테이블이 안 보이면 재실행 말고 우클릭 → Refresh.\n7. KPT\nKeep (잘한 점, 계속할 것)\n\n에러 메시지를 그대로 읽고 원인(경로·PATH·인코딩·CPU)을 하나씩 짚어서 해결했다.\n오전 이론(FK NULL 허용, 참여도)을 오후 실습 결과(DISTINCT 12행, 직원 없는 부서)와 연결해서 이해했다.\nProblem (아쉬운 점)\n\n강의 자료가 Windows 기준이라 Mac에서 그대로 따라 하면 막히는 부분이 많았다.\n환경 설정에 시간을 많이 써서 SELECT 연습 시간이 상대적으로 부족했다.\n정규화는 개념만 듣고 넘어가서 아직 직접 해 보지 못했다.\nTry (다음에 할 것)\n\n과제: AI를 활용해 물리적 모델링 SQL 파일 만들어 보기 — 요구사항 → ERD → CREATE TABLE 순서로.\n오늘 적재한 두 데이터의 ERD에서 식별 관계(실선)와 비식별 관계(점선)를 직접 찾아보기.\nWindows 전용 부분 체크: C:/ 경로 → Mac 경로, \\encoding UHC → 생략.\n실행 순서(FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY) 외워 두기."}, {"date": "2026-11-16", "mood": "😊", "summary": "n8n 마지막 수업날 ;-;", "body": "오늘의 배움\n- n8n 워크플로우 API연동하기\n- n8n 에 AI Agent연결할 때 유의사항 및 Hallucinations 막는 방법 학습\n- 예외처리의 중요성과 방법 학습\n- RAG의 사용 이유와, n8n에서 어떻게 구현해야 할 지 학습\n- n8n을 이용해 만든 간단한 챗봇을 html 웹 프론트 와 연동하는 과정 학습"}, {"date": "2026-11-13", "mood": "🙂", "summary": "나쁘지 않아~", "body": "오늘은 n8n의 기본 사용법과 API 개념을 배우고, **업무 요청을 분류해 저장하는 자동화와 내 CV를 분석해 회사·직무를 추천하는 AI 툴**을 구성해 보았다.\n\n먼저 업무 요청 자동화에서는 폼으로 받은 요청을 정리하고, **긴급도가 4 이상이면 긴급 요청으로, 그보다 낮으면 일반 요청으로 분류**하는 흐름을 다뤘다. 각 분기에 Data Table 저장 노드를 연결하고 요청자, 부서, 요청 내용, 긴급도, 분류, 접수 시각을 저장하도록 설정했다. 이 과정에서 노드가 실행됐는데도 일부 문자 컬럼이 비어 있는 문제가 발생해 필드 매핑을 수정했다. 이를 통해 **노드를 연결하는 것뿐 아니라 앞 노드의 데이터가 다음 노드의 올바른 필드로 전달되는지 확인하는 것이 중요하다**는 점을 알게 되었다. 일반 요청 테스트에서는 저장 노드의 출력값을 확인했으며, 실제 테이블과의 대조 및 수정 후 긴급 요청 재검증은 추가로 필요하다.\n\nAPI 학습에서는 n8n에서 외부 AI에 요청을 보내고 응답을 받기 위해 어떤 설정이 필요한지 살펴보았다. HTTP Request 노드의 요청 방식, 주소, 인증 정보, JSON 본문이 각각 어떤 역할을 하는지 배웠다. 특히 **HTTP 요청을 사용한다고 해서 ChatGPT 웹 구독으로 API를 이용하는 것은 아니라는 점**을 이해했다. 또한 EXAONE 연결 과정에서 접한 요청 제한 오류를 통해, 오류가 발생하면 설정 문제인지 서비스 혼잡이나 사용량 제한 문제인지 구분해서 살펴봐야 한다는 점도 배웠다.\n\n오늘 만든 나만의 AI 툴은 **CV PDF를 업로드하면 경력과 역량을 분석해 회사와 직무 조합 5개를 추천하는 도구**이다. 다음과 같은 흐름으로 구성했다.\n\n**CV PDF 업로드 → PDF 텍스트 추출 → AI 분석 및 추천 → 결과 화면 표시**\n\nPDF 업로드와 텍스트 추출을 진행하면서, 업로드된 파일을 바로 프롬프트에 넣는 것이 아니라 AI가 읽을 수 있는 텍스트로 변환하는 과정이 필요하다는 것을 알게 되었다. 추출 노드에는 파일명 대신 업로드 데이터의 속성 이름인 `cv`를 지정하고, 추출된 내용은 `{{ $json.text }}`로 다음 노드에 전달했다.\n\nAI 분석 단계에서는 **System Message로 분석 원칙을 정하고, User Message로 실제 CV 내용을 전달하는 방식**을 배웠다. CV에 없는 경력이나 성과를 만들어내지 않도록 규칙을 설정하고, 추천 이유도 CV에 있는 경험과 기술을 근거로 작성하도록 했다. 또 Structured Output Parser를 이용해 결과를 회사명, 추천 직무, 추천 이유, CV 근거, 준비할 점으로 나누는 방법을 익혔다. AI의 답변을 일정한 형식으로 받아야 이후 화면 표시나 데이터 활용이 쉬워진다는 점을 이해했다.\n\n오늘 수업을 통해 AI 툴을 만드는 일은 질문을 잘 작성하는 것뿐 아니라, **입력 데이터를 준비하고, 처리 규칙과 출력 형식을 정하고, 각 단계의 결과를 검증하는 과정**이라는 것을 배웠다. 앞으로는 만든 CV 추천 도구의 전체 흐름을 검증하고, 실제 채용 정보와 연결해 취업 준비에 활용할 수 있는 도구로 발전시키고 싶다."}, {"date": "2026-11-11", "mood": "🥰", "summary": "", "body": "1. **분석 기준을 먼저 정하기**\n    \n    AI에게 막연히 “분석해줘”라고 하기보다, 가설과 예상 결과, 사용할 데이터, 확인 방법을 먼저 정해 전달하는 것이 중요했다. 질문이 구체적이어야 분석 방향도 명확해진다.\n    \n2. **수업 자료와 실제 결과를 함께 제공하기**\n    \n    18장 노트북의 분석 방식과 직접 실행한 결과를 기준으로 요청했다. AI가 참고할 근거와 분석 범위를 명확히 주는 것이 내 학습 수준과 목적에 맞는 결과를 얻는 데 도움이 됐다.\n    \n3. **한 번에 끝내지 않고 단계별로 검토하기**\n    \n    코드 작성 → 실행 결과 확인 → 해석 검토 → 시각화 개선 순서로 진행했다. 전체 데이터에서 보인 경향을 공급사별로 다시 확인한 것처럼, AI의 첫 해석을 그대로 받아들이기보다 다른 조건에서도 성립하는지 점검해야 한다.\n    \n4. **구체적인 피드백으로 개선하기**\n    \n    그래프의 비교 방식과 자료 구성을 직접 제안하며 수정했다. 단순히 “더 좋게 만들어줘”보다 무엇이 부족하고 어떻게 바꾸고 싶은지 설명하는 것이 효과적이었다.\n    \n\n앞으로는 AI에게 분석을 맡기기 전에 **목적·데이터·검증 기준을 먼저 정리하고, 중간 결과를 확인하면서 수정하는 방식**을 사용해야겠다. AI가 만든 코드와 결론을 내가 설명할 수 있는지도 함께 확인할 것이다."}, {"date": "2026-11-10", "mood": "😊", "summary": "", "body": "오늘은 생산 실습 데이터로 **시간이 다른 기록을 연결하고, 빠진 값이 집계에 미치는 영향을 살펴본 뒤, 결과를 그래프로 해석하는 흐름**을 배웠다.\n\n## Ch15. 시간 데이터 — 시각을 계산하고 기록을 연결하기\n\n`read_csv()`의 `parse_dates`로 시각 열을 날짜·시간 자료형으로 읽으면 `.dt.hour`로 시를, `.dt.dayofweek`로 요일을 꺼낼 수 있다. 종료 시각에서 시작 시각을 빼면 걸린 시간이 나오고, 초로 바꾼 뒤 60으로 나누면 분 단위가 된다.\n\n```\nlots[\"minutes\"] = (\n    lots[\"end_time\"] - lots[\"start_time\"]\n).dt.total_seconds() / 60\n\neq201 = sensor[sensor[\"equipment\"] == \"EQ-201\"].set_index(\"timestamp\")\nhourly = eq201[\"temp_c\"].resample(\"1h\").mean()\n```\n\n`resample(\"1h\").mean()`은 기록을 **한 시간씩 묶어** 평균을 낸다. `rolling(6).mean()`은 **현재 행을 포함한 최근 6개 기록**의 평균을 행마다 구한다. 실습처럼 10분 간격이 이어지는 구간에서는 이 이동 평균으로 온도 흐름을 부드럽게 볼 수 있다.\n\n```\nit = pd.merge_asof(\n    ins.sort_values(\"insp_time\"),\n    tool.sort_values(\"tool_time\"),\n    left_on=\"insp_time\", right_on=\"tool_time\",\n    by=\"equipment\", direction=\"backward\",\n)\n```\n\n이 코드는 각 검사에 **같은 설비에서 검사 시각까지 완료된 가장 최근 공구 교체 기록**을 붙인다. 센서 기록에 로트를 붙일 때도 같은 방식으로 직전 로트 시작을 찾고, 센서 시각이 로트 종료 전인지 한 번 더 확인했다. 시작 시각만 맞추면 생산이 끝난 뒤의 기록까지 붙을 수 있기 때문이다.\n\n## Ch16. 결측치 해석 — 빈칸이 어디에 몰렸는지 보기\n\n`isna()`는 값이 비어 있으면 `True`를 반환한다. 그래서 `sum()`은 빈칸 **개수**, `mean()`은 빈칸 **비율**이 된다. 실습에서는 검사 표에 `lot_id`로 라인과 교대조를 붙인 뒤 그룹별 결측률을 비교했다.\n\n```\ninsp2[\"is_missing\"] = insp2[\"length_mm\"].isna()\nmiss_ls = insp2.groupby([\"line\", \"shift\"])[\"is_missing\"].mean() * 100\n```\n\n길이 결측은 **L3 야간에만 70.4%** 있었다. `mean()`은 빈칸을 건너뛰므로 야간 평균 길이는 전체 1,260건 중 값이 있는 373건으로 계산된다. 길이 값은 그대로 두고, 불합격률은 기록이 남아 있는 `result` 열로 계산할 수 있었다.\n\n**행은 있는데 값이 빈 경우**와 **행 자체가 없는 경우**도 구분했다. 조치 칸의 빈값은 `fillna(\"미기록\")`으로 표시해 불량 기록을 집계에 남겼다. 센서 통신이 끊겨 값만 비어 있는 구간은 실습에서 설비별 `ffill()`로 직전 값을 채우고, 채운 위치를 따로 표시했다. 설비가 멈춰 센서 행 자체가 없는 시간은 가동 이력을 확인해 구분했다.\n\n## Ch17. 시각화 — 질문에 맞는 그래프를 고르고 해석하기\n\n시간에 따른 변화는 **선 그래프**, 그룹 간 크기 비교는 **막대그래프**, 값이 몰린 구간은 **히스토그램**, 그룹별 분포와 튀는 값은 **상자 그림**, 두 수치의 관계는 **산점도**로 봤다. 설비와 시간대처럼 두 기준으로 만든 표는 **히트맵**으로 비교했다.\n\n```\nsensor[\"hour\"] = sensor[\"timestamp\"].dt.hour\ntemp = sensor.pivot_table(\n    index=\"equipment\", columns=\"hour\", values=\"temp_c\", aggfunc=\"mean\"\n)\nfig, ax = plt.subplots()\nsns.heatmap(temp, cmap=\"Reds\", ax=ax)\nplt.show()\n```\n\n`pivot_table()`이 설비별·시간대별 평균 온도 표를 만들고, `heatmap()`이 그 표를 색으로 보여 준다. 실습에서는 **EQ-201의 13~16시 평균 온도가 약 85°C로, 같은 설비의 다른 시간대보다 약 10°C 높았다.** 상자 그림에서 튀는 값도 바로 지우기 전에 실제 가능한 값인지, 다른 기록에서도 확인되는지 살펴봤다. EQ-201의 오후 고온은 같은 시간대의 고온 알람 기록에서도 확인됐다.\n\n복습할 때는 코드가 **어떤 행을 연결하는지, 집계에 몇 건이 들어가는지, 그래프에서 무엇을 비교하는지** 차례로 짚어 보겠다. 그래프 해석은 집계 표의 숫자를 가져와 **어디가, 얼마나, 무엇과 비교해 달랐는지** 한 문장으로 써 보면 된다."}, {"date": "2026-11-05", "mood": "🙂", "summary": "", "body": "**학습 주제: NumPy와 Pandas의 기본 개념 및 데이터 분석 방법**\n\n## 1. 데이터의 차원과 구조 이해\n\n데이터를 표현하는 기본 구조인 스칼라, 벡터, 행렬, 텐서의 개념을 학습했다.\n\n- **Scalar (스칼라)**: 하나의 숫자로 이루어진 0차원 데이터\n- **Vector (벡터)**: 여러 스칼라를 한 줄로 나열한 1차원 데이터\n- **Matrix (행렬)**: 행과 열로 구성된 2차원 데이터\n- **Tensor (텐서)**: 차원에 관계없이 데이터를 표현하는 일반적인 구조로, 딥러닝에서는 주로 3차원 이상의 배열을 사용\n\n벡터는 표현 방향에 따라 구분할 수 있다.\n\n- **Column Vector (열벡터)**: 하나의 속성에 대한 여러 관측값을 세로로 표현\n- **Row Vector (행벡터)**: 하나의 관측 대상이 가진 여러 속성을 가로로 표현\n\n**핵심:** 차원이 증가한다는 것은 데이터를 구분하는 축(Axis)이 추가된다는 의미다.\n\n## . NumPy의 특징과 배열 속성\n\nNumPy는 숫자 데이터를 효율적으로 저장하고 연산하기 위한 라이브러리다.\n\n파이썬의 List와 달리 NumPy 배열은 일반적으로 동일한 자료형의 데이터를 저장하며, 반복문 없이도 배열 전체에 연산을 적용할 수 있다.\n\n**List와 Array의 차이**\n\n- List: 서로 다른 자료형을 함께 저장할 수 있으며 범용적인 데이터 관리에 적합\n- NumPy Array: 동일한 자료형을 중심으로 구성되며 대량의 수치 연산에 효율적\n\n**배열에서 중요한 4가지 속성**\n\n| 속성 | 의미 | 예시 |\n| --- | --- | --- |\n| `shape` | 각 축의 크기 | `(6, 24)` |\n| `ndim` | 배열의 차원 수 | `2` |\n| `size` | 전체 원소 개수 | `144` |\n| `dtype` | 원소의 자료형 | `float64` |\n\n특히 `shape`는 데이터가 어떤 구조로 이루어졌는지 확인할 때 가장 먼저 살펴볼 속성이다.\n\n### Axis 개념\n\nAxis는 배열의 연산이 적용되는 방향을 결정한다.\n\n- 차원 배열을 기준으로 다음과 같이 이해했다.\n- `axis=0`: 행 방향으로 이동하며 계산하므로 열마다 결과가 생성됨\n- `axis=1`: 열 방향으로 이동하며 계산하므로 행마다 결과가 생성됨\n\n예를 들어 `sum(axis=0)`은 각 열의 합계를, `sum(axis=1)`은 각 행의 합계를 계산한다.\n\n**주의:** Axis는 단순히 가로와 세로를 뜻하기보다, 연산 과정에서 어느 축을 따라 데이터를 묶거나 축소하는지 나타낸다.\n\n## 3. 조건 마스크(Boolean Mask)의 개념\n\n조건 마스크는 데이터의 각 원소에 조건을 적용하여 `True` 또는 `False`로 표현하는 방법이다.\n\n예시: `arr = np.array([70, 80, 90, 100])`\n\n- `arr > 80` → `[False, False, True, True]`\n- `arr[arr > 80]` → `[90, 100]`\n\n조건을 만족하는 데이터만 추출할 수 있으며, Pandas에서도 특정 조건의 행을 선택할 때 활용한다.\n\n**핵심:** 반복문을 사용하지 않고 원하는 조건의 데이터만 선택할 수 있다는 점이 중요하다.\n\n## 4. Pandas의 Series와 DataFrame\n\nPandas는 행과 열로 구성된 데이터를 분석하고 가공하는 라이브러리다.\n\n- **Series**: 인덱스와 값으로 구성된 1차원 데이터\n- **DataFrame**: 여러 Series가 공통 행 인덱스를 기준으로 결합된 2차원 표 형식 데이터\n- **Column (열)**: 특정 속성의 데이터 집합으로, 하나의 열을 선택하면 일반적으로 Series가 반환됨\n- **Row (행)**: 하나의 관측 대상에 대한 정보이며, Record라고도 부름\n\n### Index의 개념\n\nIndex는 데이터의 각 행을 식별하거나 선택하기 위한 레이블이다.\n\n예시:\n\n`target = pd.Series([50.0, 80.0, 120.0], index=[\"브래킷\", \"커버\", \"하우징\"])`\n\n여기서 브래킷, 커버, 하우징은 각 데이터에 대응하는 인덱스다.\n\n- 인덱스는 단순한 순번이 아니라 데이터에 붙은 레이블이다.\n- 숫자뿐 아니라 문자열도 사용할 수 있다.\n- 인덱스는 반드시 고유해야 하는 것은 아니지만, 고유하면 데이터를 구분하기 편리하다.\n\n## 5. DataFrame의 기본 탐색 방법\n\n처음 접하는 데이터는 다음 순서로 구조와 특징을 파악한다.\n\n**`shape` → `head()` → `info()` → `describe()`**\n\n- `shape`: 전체 행과 열의 개수 확인\n- `head()`: 처음 5개 행을 확인하여 데이터의 형태 파악\n- `info()`: 인덱스, 컬럼, 결측치, 자료형 확인\n- `describe()`: 숫자형 데이터의 평균, 표준편차, 최솟값, 최댓값 등 확인\n\n문자열 데이터는 다음 함수로 확인할 수 있다.\n\n- `value_counts()`: 값별 등장 횟수\n- `nunique()`: 서로 다른 값의 개수\n- `nique()`: 중복을 제외한 실제 값의 종류\n\n### info() 결과 해석\n\n오늘 실습한 `lots.info()`의 결과는 다음과 같다.\n\n- `RangeIndex: 1656 entries, 0 to 1655` → 총 1,656개의 행\n- `Data columns: 13` → 총 13개의 열\n- `Non-Null Count: 1656` → 해당 열에 결측치가 없는 상태\n- `Dtype: str` → 문자열 자료형\n- `Dtype: int64` → 정수형 자료형\n- `memory usage: 307.4 KB` → 데이터프레임의 메모리 사용량\n\n**결측치 개수 = 전체 행 개수 - Non-Null Count**\n\n이번 데이터는 모든 열의 Non-Null Count가 1,656이므로 `info()` 기준 결측치가 존재하지 않는다.\n\n### Dtype이 중요한 이유\n\n자료형에 따라 적용할 수 있는 연산과 분석 방법이 달라지기 때문이다.\n\n- 숫자형: 합계, 평균, 표준편차 등의 연산 가능\n- 문자열형: 문자 검색, 분리, 변환 등의 작업 가능\n- 날짜형: 날짜 차이, 기간별 집계 등 가능\n\n특히 숫자나 날짜가 문자열로 저장되어 있으면 원하는 분석이 어렵거나 연산 오류가 발생할 수 있으므로, 분석 전에 자료형을 확인해야 한다.\n\n## 6. loc와 iloc의 차이\n\nPandas에서 원하는 행과 열을 선택하는 두 가지 방법을 학습했다.\n\n- **`loc`**: 인덱스와 컬럼의 이름(레이블)을 기준으로 선택\n- **`iloc`**: 행과 열의 정수 위치를 기준으로 선택\n\n예시:\n\n- `lots.loc[0, \"lot_id\"]` → 인덱스 레이블이 0인 행의 lot_id\n- `lots.iloc[0, 0]` → 첫 번째 행, 첫 번째 열의 값\n\n`loc`는 조건 마스크와 결합하여 특정 조건을 만족하는 행을 선택하거나 값을 수정할 수 있다.\n\n예시:\n\n`lots.loc[lots[\"defect_qty\"] > 0, \"lot_id\"]`\n\n→ 불량 수량이 0보다 큰 생산 Lot의 ID만 추출\n\n**핵심:** `loc`는 레이블과 조건을 활용하고, `iloc`는 정수 위치를 기준으로 데이터를 선택한다.\n\n## 7. 실습 중 주의할 점\n\n**CSV 파일을 읽을 때 구분자 설정**\n\n`np.loadtxt()`로 CSV 데이터를 불러올 때는 `delimiter=\",\"` 설정이 필요할 수 있다.\n\n쉼표로 구분된 데이터를 읽으면서 구분자를 지정하지 않으면 여러 숫자를 하나의 문자열로 인식해 `ValueError`가 발생할 수 있다.\n\n또한 파일 경로가 잘못된 경우에는 `FileNotFoundError`가 발생한다.\n\n오류 메시지를 확인하여 데이터 변환 문제인지, 파일 경로 문제인지 구분하는 것이 중요하다.\n\n## 8. 오늘의 학습 정리 및 느낀 점\n\n오늘은 NumPy와 Pandas를 활용하기 위한 기초 개념을 학습했다.\n\n특히 다음 세 가지가 중요하다고 생각했다.\n\n1. **데이터의 차원과 Axis 이해**: 배열의 구조와 연산 방향을 정확하게 파악해야 한다.\n2. **데이터의 구조와 자료형 확인**: 분석하기 전에 데이터의 형태, 결측치, 자료형을 확인하는 습관이 필요하다.\n3. **조건을 활용한 데이터 선택**: 조건 마스크와 `loc`를 이용하면 반복문 없이 원하는 데이터만 효율적으로 추출하고 수정할 수 있다.\n\n기존에는 리스트와 반복문을 활용하여 데이터를 하나씩 처리하는 방식에 익숙했지만, NumPy와 Pandas를 사용하면 데이터를 배열과 표 단위로 다룰 수 있다는 점이 인상적이었다.\n\n앞으로는 배열을 직접 생성하는 문법을 외우는 것보다 **데이터의 구조를 이해하고, 원하는 데이터를 선택하고, 분석하는 방법**에 집중하려고 한다."}, {"date": "2026-11-04", "mood": "😊", "summary": "", "body": "## 1. 함수(Function)와 Docstring\n\n- 함수는 반복되는 코드를 하나로 묶어 필요할 때 재사용하는 기능이다.\n- `def` 키워드로 함수를 정의하고, 함수 이름에 `()`를 붙여 호출한다.\n- **Docstring**은 함수 내부에 `\"\"\" \"\"\"`를 사용해 작성하며, 함수의 목적, 매개변수, 반환값 등을 설명한다.\n- Docstring을 작성하면 다른 사람이나 AI가 함수의 내부 코드를 모두 읽지 않아도 기능과 사용 방법을 이해하기 쉽다.\n\n## 2. Parameter와 Argument\n\n- **Parameter(매개변수)**: 함수를 정의할 때 사용하는 변수\n- **Argument(인자)**: 함수를 호출할 때 실제로 전달하는 값\n\n| 구분 | 의미 |\n| --- | --- |\n| Default Parameter | 매개변수에 기본값을 설정 |\n| Positional Argument | 인자를 전달하는 순서에 따라 매칭 |\n| Keyword Argument | 매개변수 이름을 지정해 값을 전달 |\n\n```python\ndef greet(name, age=20):\n    print(name, age)\n\ngreet(\"철수\")           # 기본값 사용\ngreet(\"철수\", 25)       # Positional\ngreet(age=25, name=\"철수\")  # Keyword\n```\n\n## 3. Print와 Return의 차이\n\n- `print()`는 결과를 화면에 출력하는 기능이다.\n- `return`은 함수 실행 결과를 호출한 위치로 반환하는 기능이다.\n- `print()`만 사용하면 출력된 값을 다른 연산에 직접 재사용할 수 없다.\n- `return`을 활용하면 반환값을 변수에 저장하거나 다른 함수에서 활용할 수 있다.\n\n**핵심: print는 보여주는 것, return은 값을 돌려주는 것이다.**\n\n## 4. `args`와 `*kwargs`\n\n- `args`: 여러 개의 Positional Argument를 튜플로 받는다.\n- `*kwargs`: 여러 개의 Keyword Argument를 딕셔너리로 받는다.\n- 함수를 호출할 때 리스트 앞에 를 붙이면 리스트의 요소를 개별 인자로 풀어서 전달한다.\n- 딕셔너리 앞에 `*`를 붙이면 키와 값을 각각 이름과 값으로 전달한다.\n\n```python\ndef add(a, b):\n    return a + b\n\nnums = [10, 20]\nadd(*nums)  # add(10, 20)과 동일\n```\n\n## 5. Scope(스코프)\n\n- Scope는 변수가 사용될 수 있는 유효 범위를 의미한다.\n- **Local Scope**: 함수 내부에서 정의되어 해당 함수 안에서 사용되는 변수\n- **Global Scope**: 함수 외부에서 정의되어 전역 범위에서 사용되는 변수\n- 중첩 함수에서는 바깥 함수의 변수도 참조할 수 있다.\n\n변수가 어디에서 정의되었는지에 따라 접근 가능한 범위가 달라진다는 점을 이해했다.\n\n## 6. 함수를 변수에 저장하기\n\n파이썬에서는 함수도 하나의 객체이므로 변수에 저장할 수 있다.\n\n```python\ndef hello():\n    return \"Hello\"\n\nfunc = hello\nprint(func())  # Hello\n```\n\n- `func = hello`: 함수 자체를 변수에 저장\n- `func = hello()`: 함수를 실행한 결과를 변수에 저장\n\n이러한 특징을 **일급 함수(First-class Function)**라고 하며, Callback을 이해하는 기초가 된다.\n\n## 7. 외부 함수와 내부 함수\n\n함수 내부에 다른 함수를 정의하는 것을 중첩 함수(Nested Function)라고 한다.\n\n- 외부 함수는 전체적인 실행 흐름을 담당한다.\n- 내부 함수는 외부 함수에서 필요한 세부 동작을 수행한다.\n- 내부 함수는 외부 함수의 지역 변수에 접근할 수 있다.\n\n복잡한 기능을 역할에 따라 구분하고, 관련된 기능을 하나의 함수 내부에 묶을 때 활용할 수 있다.\n\n## 8. Callback 함수 ⭐ 핵심 학습\n\n**Callback은 함수를 다른 함수의 인자로 전달하고, 전달받은 함수가 필요한 시점에 이를 호출하는 방식이다.**\n\n```python\ndef calculate(a, b, callback):\n    return callback(a, b)\n\ndef add(a, b):\n    return a + b\n\ndef multiply(a, b):\n    return a * b\n\ncalculate(3, 5, add)       # 8\ncalculate(3, 5, multiply)  # 15\n```\n\n### Callback을 사용하는 이유\n\n1. **유연성**: 기존 함수를 수정하지 않고도 실행할 동작을 변경할 수 있다.\n1. **재사용성**: 공통 처리 과정은 유지하면서 세부 기능을 교체할 수 있다.\n1. **결합도 감소**: 함수가 특정 기능의 구현 방식에 직접 의존하지 않도록 만들 수 있다.\n1. **실행 시점 제어**: 특정 조건이나 이벤트가 발생했을 때 전달받은 함수를 실행할 수 있다.\n\n### 원리와 배경\n\nCallback이 가능한 이유는 파이썬에서 **함수를 하나의 값처럼 취급할 수 있기 때문**이다.\n\n기존에는 실행할 기능을 변경하려면 함수 내부 코드를 수정해야 하는 경우가 많지만, Callback을 사용하면 외부에서 실행할 함수를 전달하여 동작을 변경할 수 있다.\n\n단, Callback이 항상 좋은 것은 아니다. 지나치게 사용하면 함수 간 호출 관계를 파악하기 어려워질 수 있으므로, **동작을 교체하거나 실행 시점을 분리해야 할 필요가 있을 때 사용하는 것이 중요하다.**\n\n## 9. 모듈(Module) 불러오기\n\n모듈은 함수나 변수 등을 별도의 파이썬 파일로 정리해 놓은 것이다.\n\n| 방식 | 특징 |\n| --- | --- |\n| `import math` | 모듈 전체를 불러와 `math.sqrt()`처럼 사용 |\n| `import math as m` | 모듈에 별칭을 붙여 `m.sqrt()`처럼 사용 |\n| `from math import sqrt` | 특정 기능만 가져와 `sqrt()`처럼 사용 |\n\n모듈을 활용하면 기존에 작성된 기능을 재사용할 수 있어 코드의 중복을 줄일 수 있다.\n\n---\n\n## 오늘의 핵심 회고\n\n오늘은 단순히 함수를 정의하고 호출하는 방법에서 나아가, **함수를 어떻게 설계해야 재사용성과 유지보수성을 높일 수 있는지** 학습했다.\n\n특히 가장 중요하게 느낀 개념은 Callback이다. 함수를 다른 함수에 전달할 수 있다는 파이썬의 특징을 이해하면서, 기존 코드를 수정하지 않고도 실행할 동작을 변경하는 구조를 배웠다.\n\n앞으로는 문법을 암기하는 것에 그치지 않고, **왜 이러한 구조가 등장했으며 어떤 문제를 해결하기 위해 사용하는지**를 중심으로 학습해야겠다고 생각했다."}, {"date": "2026-11-03", "mood": "😊", "summary": "", "body": "*defaultdict → 스킵\n\n1. 딕셔너리 — 이름을 붙여 데이터를 저장하기\n    - 데이터를 키: 값 형태로 저장하는 자료형이다.\n    - 리스트는 순서인 인덱스로 접근하지만, 딕셔너리는 키로 원하는 값을 찾는다.\n    - 예를 들어 r[\"length_mm\"]은 r이라는 딕셔너리에서 길이 값을 가져온다는 뜻이다.\n    - 여러 부품의 정보를 딕셔너리로 만들고, 이를 리스트에 모으면 데이터를 묶어서 관리할 수 있다.\n2. 조건문 — 조건에 따라 다른 작업 실행하기\n    - if는 첫 번째 조건을, elif는 추가 조건을 확인하고, else는 앞의 조건이 모두 거짓일 때 실행한다.\n    - if-elif-else에서는 위에서부터 확인하고, 처음 참이 된 부분만 실행한다.\n    - 80.0 \u003c= length \u003c= 80.5처럼 범위를 한 번에 표현할 수 있다.\n    - None은 값이 없다는 뜻이며, 숫자와 비교하기 전에 is None으로 먼저 확인해야 한다.\n3. 반복문 — 여러 데이터를 하나씩 처리하기\n    - for문은 리스트 등에 들어 있는 값을 하나씩 꺼내 같은 작업을 반복한다.\n    - for r in records:에서는 반복할 때마다 r에 부품 정보 하나가 들어간다.\n    - 반복문 안에 반복문을 넣으면 바깥쪽 값 하나마다 안쪽 반복 전체가 실행된다. 두 목록이 자동으로 하나씩 짝지어지는 것은 아니다.\n4. 들여쓰기와 누적 변수 — 실행 위치 구분하기\n    - 파이썬에서는 들여쓰기로 조건문과 반복문에 포함되는 코드의 범위를 정한다.\n    - 개수를 세는 변수는 반복문 시작 전에 0으로 만들고, 조건을 만족할 때마다 += 1로 증가시킨다.\n    - 반복문 안의 print()는 매번 실행되고, 반복문 밖의 print()는 반복이 끝난 후 실행된다.\n    배운 점\n\n데이터를 딕셔너리로 정리하고, 반복문으로 하나씩 꺼낸 뒤, 조건문으로 판정하는 흐름을 이해했다. 특히 코드가 실행되는 순서와 들여쓰기에 따라 결과가 달라지므로, 작성할 때 각 변수가 어떤 값을 가지는지 하나씩 따라가 보는 것이 중요하다는 점을 배웠다."}, {"date": "2026-11-02", "mood": "😊", "summary": "", "body": "1. 파싱 VS 타입 캐스팅(형변환) 차이점\n    \n    파싱은 문자열의 구조를 해석해 필요한 정보를 추출하는 과정이다. 예를 들어 LOT 번호를 split(\"-\")으로 나눠 날짜와 장비 번호를 구분할 수 있다.\n    형변환은 값의 자료형을 바꾸는 과정이다. 예를 들어 int(\"123\")은 문자열을 정수로 바꾼다.\n    문자열을 숫자로 바꾸는 작업은 문자열 해석과 형변환이 함께 일어나므로 두 개념이 겹칠 수 있다.\n    \n2. 기본적인 4가지 변수, 자료형, 연산자 정리\n    \n    변수는 값을 저장하고 이름으로 참조하기 위해 사용한다.\n    기본 자료형으로 int(정수), float(실수), str(문자열), bool(참과 거짓)을 배웠다.\n    산술 연산자(+, -, *, /, //, %, **), 비교 연산자(==, !=, >, \u003c 등), 논리 연산자(and, or, not)를 목적에 맞게 사용한다.\n    =는 값을 대입하고, ==는 두 값이 같은지 비교한다.\n    \n3. 문자열 포멧 스트림\n    \n    문자열 안에 변수나 계산 결과를 넣어 원하는 형태로 출력하는 방법이다.\n    f\"장비: {equipment}\"처럼 문자열 앞에 f를 붙이고 {} 안에 변수를 넣는다.\n    {value:.2f}는 소수점 둘째 자리까지 표시하고, {text:\u003c20}은 20칸을 확보해 왼쪽으로 정렬한다.\n    출력 형식을 통일하면 데이터를 비교하고 확인하기 쉽다.\n    \n4. 인덱싱, 슬라이싱 및  수정\n    \n    인덱싱은 특정 위치의 값 하나를 가져오는 것으로, 첫 번째 위치는 0, 마지막 위치는 -1이다.\n    슬라이싱은 [시작:끝:간격]으로 일부 구간을 가져오며, 끝 위치는 포함하지 않는다.\n    문자열은 일부 문자를 직접 수정할 수 없어 replace()나 슬라이싱으로 새 문자열을 만들어야 한다.\n    리스트는 items[0] = \"새 값\"처럼 특정 위치의 값을 직접 수정할 수 있다.\n    \n5. 리스트의 특징\n    \n    리스트는 여러 값을 순서대로 저장하는 자료형이며, 대괄호 [ ]로 만든다.\n    중복된 값과 서로 다른 자료형을 함께 담을 수 있다.\n    생성 후에도 값의 추가, 삭제, 수정이 가능하다.\n    append()로 값을 추가하고, remove()로 일치하는 값 하나를 삭제하며, len()으로 요소 개수를 확인한다."}, {"date": "2026-10-30", "mood": "😊", "summary": "", "body": "# 📖 LG AX School | 10월 30일 학습 회고\n\n**학습 주제:** 생성형 AI를 활용한 이미지, 문서 콘텐츠 및 웹 서비스 제작\n\n**오늘의 핵심 인사이트**\n\n> 생성형 AI의 결과물은 도구 자체의 성능뿐 아니라 사용자가 제공하는 소스의 품질과 요구사항의 구체성에 크게 영향을 받는다. AI 도구별 특성을 이해하고 목적에 맞는 프롬프트를 설계하는 것이 중요하다고 느꼈다.\n> \n\n---\n\n## 1️⃣ Fact | 오늘 학습한 내용\n\n오늘은 생성형 AI를 활용하여 이미지 제작부터 문서 기반 콘텐츠 생성, 웹 서비스 구현까지 다양한 형태의 결과물을 만드는 실습을 진행했다.\n\n- **이미지 생성 (Nano Banana):** 단순 프롬프트와 역할, 맥락, 과제, 제약, 형식으로 구조화한 프롬프트를 비교하며 신제품 런칭 포스터를 제작했다. 이후 팀 마스코트 제작 실습도 진행했다.\n- **문서 기반 콘텐츠 생성 (NotebookLM):** LG전자 2026년 1분기와 2분기 경영실적 자료를 바탕으로 현황 보고서를 구성하고, 이를 3분 발표용 슬라이드로 전환하는 과정을 학습했다.\n- **프롬프트 최적화:** AI에 자료를 전달하기 전 불필요한 정보를 제거하고, 청중과 출력 형식을 명확히 지정하는 소스 정제 방법을 학습했다.\n- **AI 웹 구현 (Google AI Studio):** 시사 O/X 퀴즈와 간단한 게임을 구현하는 실습을 통해 자연어로 웹 애플리케이션의 기능과 디자인을 정의하는 방법을 익혔다.\n\n## 2️⃣ Feeling | 느낀 점\n\n기존에는 AI를 주로 텍스트 분석과 보고서 작성에 활용했지만, 오늘은 이미지와 웹 애플리케이션처럼 시각적이고 실제로 활용할 수 있는 결과물까지 제작할 수 있다는 점이 흥미로웠다.\n\n특히 프롬프트를 구체화하는 과정에서 **단순히 설명을 길게 작성하는 것과 요구사항을 체계적으로 정의하는 것은 다르다**는 점을 다시 생각하게 되었다.\n\n또한 NotebookLM 실습을 통해 AI가 문서를 빠르게 요약하고 재구성하더라도, 자료의 정확성과 최종 결과물의 적절성을 판단하는 것은 결국 사용자의 몫이라는 생각이 들었다.\n\n## 3️⃣ Finding | 배운 점과 인사이트\n\n**① 프롬프트의 핵심은 길이가 아닌 구조와 명확성이다.**\n\n- 역할, 맥락, 과제, 제약, 형식을 구분하면 AI가 따라야 할 기준이 명확해진다.\n- 특히 이미지 생성에서는 텍스트 위치, 화면 비율, 색감처럼 구체적인 시각적 조건을 정의하는 것이 중요하다.\n\n**② 소스의 품질이 결과물의 신뢰성을 결정한다.**\n\n- NotebookLM과 같은 문서 기반 AI는 제공된 소스에 크게 의존하므로 자료 정제 과정이 중요하다.\n- 같은 자료라도 청중과 목적에 따라 보고서와 발표 자료의 구성 및 정보 밀도가 달라져야 한다.\n\n**③ AI를 활용한 개발에서도 요구사항 정의가 중요하다.**\n\n- Google AI Studio를 활용하면 코드를 직접 작성하지 않고도 웹 서비스의 초기 형태를 구현할 수 있다.\n- 다만 화면을 생성하는 것과 실제 기능이 정상적으로 작동하는 것은 별개의 문제이므로 테스트와 수정이 필요하다.\n\n**④ AI 도구는 목적에 맞춰 선택하고 연결해야 한다.**\n\n- 이미지 생성, 문서 분석, 웹 구현 도구는 각각 강점이 다르다.\n- 하나의 도구에 모든 작업을 맡기기보다는 단계별로 적합한 도구를 활용하는 것이 효율적일 수 있다.\n\n## 4️⃣ Future Action | 앞으로의 실천\n\n- **프롬프트 템플릿화:** 반복적으로 수행하는 이미지 생성, 보고서 작성, 웹 구현 작업에 활용할 수 있는 구조화된 프롬프트를 만들어 둘 계획이다.\n- **소스 검증 습관화:** AI가 작성한 문서의 핵심 수치와 주장에 대해 원본 자료와 출처를 확인하는 절차를 적용하고자 한다.\n- **도구 간 연계 실험:** NotebookLM으로 자료를 분석하고, ChatGPT로 구조를 설계한 뒤, 다른 생성형 AI로 시각화하는 워크플로를 시도해 보고 싶다.\n- **결과물 중심 학습:** 앞으로는 실습 결과물뿐 아니라 사용한 프롬프트, 수정 과정, 개선 이유까지 기록하여 재사용 가능한 작업 방식으로 발전시키고자 한다.\n\n---\n\n## 📂 실습 결과물 아카이브\n\n### ▶ 01. Nano Banana | LG전자 신제품 런칭 포스터\n\n**학습 목표:** 단순 프롬프트와 구조화된 프롬프트의 차이 이해\n\n**첨부할 결과물**\n\n- 초기 프롬프트 기반 포스터\n- 구조화된 프롬프트 기반 포스터\n- 사용한 프롬프트 및 수정 내용\n\n📎 [이미지 첨부 공간]\n\n### ▶ 02. Nano Banana | LGenius 팀 마스코트\n\n**학습 목표:** 팀 아이덴티티를 반영한 캐릭터 및 시각 디자인 제작\n\n**첨부할 결과물**\n\n- LGenius 문어 마스코트\n- 디자인 개선 전후 이미지\n- 최종 프롬프트\n\n📎 [이미지 첨부 공간]\n\n### ▶ 03. NotebookLM | 2026년 상반기 경영실적 보고서\n\n**학습 목표:** 다수의 원본 문서를 분석하고 근거 기반 보고서 작성\n\n**첨부할 결과물**\n\n- 2026년 1분기 및 2분기 경영실적 자료\n- 상반기 경영실적 현황 보고서\n- 보고서 생성 프롬프트\n\n📎 [PDF 및 보고서 첨부 공간]\n\n### ▶ 04. NotebookLM | 3분 발표용 PPT\n\n**학습 목표:** 보고서를 청중과 발표 목적에 맞는 슬라이드로 재구성\n\n**첨부할 결과물**\n\n- 5장 분량 발표 슬라이드\n- 슬라이드 생성 프롬프트\n- 발표자 노트\n\n📎 [PPT 및 PDF 첨부 공간]\n\n### ▶ 05. Google AI Studio | 시사 O/X 퀴즈 게임\n\n**학습 목표:** 자연어 프롬프트를 활용한 인터랙티브 웹 구현\n\n**첨부할 결과물**\n\n- 퀴즈 게임 실행 화면\n- 게임 실행 링크\n- 구현 프롬프트 및 수정 내용\n\n📎 [스크린샷 및 URL 첨부 공간]\n\n### ▶ 06. Google AI Studio | 자유 주제 웹 게임 및 서비스\n\n**학습 목표:** 사용자의 행동과 기능 요구사항을 정의하여 웹 서비스 구현\n\n**첨부할 결과물**\n\n- 자유 제작 게임 실행 화면\n- 고객 상황 기반 서비스 안내 웹페이지 (제작 시)\n- 실행 링크 및 사용 프롬프트\n\n📎 [스크린샷 및 URL 첨부 공간]\n\n---\n\n## 💡 오늘의 한 줄 회고\n\n**AI를 잘 활용한다는 것은 단순히 원하는 결과물을 생성하는 것이 아니라, 목적에 맞는 도구를 선택하고 명확한 요구사항과 신뢰할 수 있는 소스를 제공한 뒤 결과물을 검증하는 과정이라는 점을 배웠다.**"}, {"date": "2026-10-29", "mood": "😊", "summary": "", "body": "**K (Keep) — 오늘 작동한 것**\n\n- **개인:** “Day 2에서는 전략 설계 담당으로서 내가 만들어야 할 결과와 판단 기준을 먼저 GCB로 정리했다. 보고서의 완성도뿐 아니라, 이 결과가 임원의 어떤 결정을 도와야 하는지 생각하며 작업한 점을 유지하고 싶다.”\n- **팀:** “우리 팀에서 가장 잘 작동한 패턴은 **Structure**였다. 데이터, 고객 감정, 관계와 채널, 운영 구조로 역할을 나누고 공통 Goal로 연결하면서, 같은 문제를 서로 다른 관점에서 살필 수 있었다.”\n\n**P (Problem) — 막힌 것**\n\n- **개인:** “Polarity가 무너진 순간은 빠른 결과물과 역할 설계에 집중하면서, 원본 데이터 확보와 검증을 뒤로 미뤘을 때였다. 설득력 있는 전략도 근거가 부족하면 가설이라는 점을 놓치기 쉬웠다.”\n- **팀:** “팀이 겪은 문제는 **공통 입력 자료와 지표 정의의 불일치**였다. 2024년 리뷰와 2026년 케이스, 부정률과 재구매 거부 의향이 섞여 있었다. 역할별 결과를 모으기만 해서는 하나의 일관된 판단이 되지 않는다는 것을 확인했다.”\n\n**T (Try) — 다음에 바꿀 것**\n\n- **개인:** “다음 Agentic Work에서는 전략을 정하기 전에 **확인된 사실, 해석, 가정, 추가로 필요한 데이터**를 먼저 구분하겠다. AI가 제시한 우선순위를 그대로 받아들이지 않고, 수치의 분모와 비교 기준, 한계를 확인하는 판단 책임을 내가 갖겠다.”\n- **팀:** “다음 작업 전에는 동일한 원본 자료, 지표 정의, 역할별 책임과 인계 형식을 먼저 합의하겠다. 각자 ‘핵심 발견, 근거, 한계, 다른 역할에 필요한 것’을 중간에 공유하고, 통합 단계에서는 충돌을 숨기지 않고 조율하겠다. **병렬화의 속도는 역할을 나누는 것뿐 아니라, 서로 기다리거나 다시 작업할 일을 줄이는 데서 나온다.**”"}, {"date": "2026-10-28", "mood": "🙂", "summary": "", "body": "1. Fact | 객관적인 사실\n\n- AX Work의 개념과 Role Shift, Agent의 구조, GCB 기반 프롬프팅, Agentic Communication 및 Feedback에 대해 학습함.\n- 멀티턴을 활용해 AI와 상호작용하고, 피드백을 통해 결과물을 개선하는 방법을 배움.\n- 강의 중 멀티턴의 효율성에 의문을 가지고 GPT를 활용해 관련 연구와 싱글턴 및 멀티턴의 특성을 추가로 탐구함.\n\n2. Feeling | 느낀 점\n\n- 강의에서는 멀티턴의 유용성을 강조했지만, 이를 뒷받침하는 논문이나 정량적 자료보다 강사님의 경험과 암묵지에 기반한 설명이 중심이라는 인상을 받음.\n- 설명을 그대로 수용하기보다 실제로 효과적인 방법인지 스스로 검증하고 싶었고, 수업 중 별도로 질문하고 자료를 탐색하는 데 많은 시간을 사용함.\n- 다만 이러한 의문을 해결하는 과정에서 강의 내용에 대한 이해가 깊어졌고, AI 활용 방법을 비판적으로 판단하는 태도의 중요성을 느낌.\n\n3. Finding | 배운 점\n\n- **구체적인 목표와 조건을 제시한 싱글턴이 불명확한 지시를 반복하는 멀티턴보다 효율적이고 완성도 높은 결과물을 생성할 수 있음**을 이해함.\n- 싱글턴은 목표와 결과물의 형식이 명확한 작업에, 멀티턴은 요구사항을 탐색하거나 중간 결과를 검증하고 수정해야 하는 작업에 적합하다는 인사이트를 얻음.\n- 멀티턴은 대화가 길어질수록 초기 조건이 누락되거나 잘못된 가정이 유지될 수 있으므로, 질문 횟수보다 맥락 관리와 피드백의 품질이 중요함을 배움.\n- AI가 제공하는 답변뿐 아니라 강의에서 제시하는 방법론 역시 근거를 확인하고 실제로 검증하는 과정이 필요하다는 점을 깨달음.\n\n4. Future Action | 향후 행동\n\n- 보고서 작성과 데이터 분석 등 동일한 과제를 싱글턴과 멀티턴으로 각각 수행하여 결과물의 정확도, 완성도, 소요 시간을 비교할 계획임.\n- 작업 시작 전 GCB를 활용해 목표와 맥락, 제약조건을 명확하게 정의하고, 필요할 때만 멀티턴 피드백을 활용하는 방식을 적용할 예정임.\n- 향후 AX School 학습 과정에서도 제시된 방법을 그대로 수용하기보다 관련 근거를 확인하고, 실험 결과를 기록해 프로젝트 경험으로 발전시키고자 함."}]}</script>
<script>
const DATA=JSON.parse(document.getElementById('data').textContent);
const entries=DATA.entries; // newest first
const $=id=>document.getElementById(id);
document.querySelector('.rings').innerHTML=Array.from({length:13},(_,i)=>{const tilt=[-8,3,-4,6,-2][i%5],rise=[0,1.5,-1,0.5][i%4];return `<svg class="ring" viewBox="0 0 40 26" style="transform:rotate(${tilt}deg)" aria-hidden="true"><path d="M 30,${8+rise} C 24,${2+rise} 6,3 4,11 C 1,21 22,24 31,17 C 35,14 34,10 30,${8+rise}"/><path d="M 29,17 L 31,18"/></svg>`;}).join('');
$('updated').textContent=DATA.generated;
let selected=null,month=null;
const pad=n=>String(n).padStart(2,'0');
const longDate=d=>new Date(d+'T12:00:00').toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'long'});
function renderBody(text){
 // 텍스트로만 넣고 **굵게**만 강조로 바꿉니다(HTML은 해석하지 않음).
 const el=$('body');el.replaceChildren();
 text.split(/(\*\*[^*\n]+\*\*)/).forEach(part=>{
  if(/^\*\*[^*\n]+\*\*$/.test(part)){const s=document.createElement('strong');s.textContent=part.slice(2,-2);el.append(s);}
  else el.append(document.createTextNode(part));
 });
}
function show(date,push=true){
 const i=entries.findIndex(e=>e.date===date);if(i<0)return;
 const e=entries[i];selected=date;month=date.slice(0,7);
 $('dateLabel').textContent=longDate(date);$('mood').textContent=e.mood;$('summary').textContent=e.summary;renderBody(e.body);
 $('older').disabled=i===entries.length-1;$('newer').disabled=i===0;
 $('position').textContent=`${entries.length-i} / ${entries.length}`;
 if(push&&location.hash!=='#'+date)history.replaceState(null,'','#'+date);
 calendar();
}
function calendar(){
 $('monthLabel').textContent=month.replace('-','. ');const cal=$('calendar');cal.replaceChildren();
 for(const t of ['일','월','화','수','목','금','토']){const el=document.createElement('div');el.className='weekday';el.textContent=t;cal.append(el);}
 const [y,m]=month.split('-').map(Number),start=new Date(y,m-1,1).getDay(),count=new Date(y,m,0).getDate();
 for(let i=0;i<start;i++)cal.append(document.createElement('span'));
 for(let d=1;d<=count;d++){
  const date=`${month}-${pad(d)}`,entry=entries.find(e=>e.date===date),el=document.createElement('button');
  el.className='day'+(entry?' has':'')+(date===selected?' selected':'');el.textContent=d;
  if(entry){const mark=document.createElement('small');mark.textContent=entry.mood||'―';el.append(mark);el.onclick=()=>show(date);el.setAttribute('aria-label',date+' 글 보기');}
  else{el.disabled=true;el.setAttribute('aria-label',date);}
  if(date===selected)el.setAttribute('aria-pressed','true');
  cal.append(el);
 }
}
function moveMonth(o){const [y,m]=month.split('-').map(Number),d=new Date(y,m-1+o,1);month=`${d.getFullYear()}-${pad(d.getMonth()+1)}`;calendar();}
$('prev').onclick=()=>moveMonth(-1);$('next').onclick=()=>moveMonth(1);
$('older').onclick=()=>{const i=entries.findIndex(e=>e.date===selected);if(i<entries.length-1)show(entries[i+1].date);};
$('newer').onclick=()=>{const i=entries.findIndex(e=>e.date===selected);if(i>0)show(entries[i-1].date);};
function search(){
 const q=$('search').value.trim().toLowerCase();$('results').replaceChildren();
 if(!q){$('searchStatus').textContent='기억나는 단어로 지난 하루를 찾아보세요.';return;}
 const hits=entries.filter(e=>(e.summary+'\n'+e.body).toLowerCase().includes(q));
 $('searchStatus').textContent=`${hits.length}개의 하루`;
 for(const e of hits){const content=e.summary+'\n'+e.body,pos=Math.max(0,content.toLowerCase().indexOf(q)-30);const b=document.createElement('button');b.className='result';const t=document.createElement('strong'),x=document.createElement('span');t.textContent=e.date+' '+e.mood;x.textContent=e.summary||content.slice(pos,pos+130);b.append(t,x);b.onclick=()=>show(e.date);$('results').append(b);}
}
$('search').addEventListener('input',search);
window.addEventListener('hashchange',()=>show(location.hash.slice(1),false));
search();
if(entries.length){show(entries.some(e=>'#'+e.date===location.hash)?location.hash.slice(1):entries[0].date,false);}
else{const d=new Date();month=`${d.getFullYear()}-${pad(d.getMonth()+1)}`;$('dateLabel').textContent='아직 공개된 글이 없어요.';$('older').disabled=$('newer').disabled=true;calendar();}
</script>
</html>
